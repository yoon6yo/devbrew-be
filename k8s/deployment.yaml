apiVersion: v1
kind: Namespace
metadata:
  name: devbrew
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devbrew
  namespace: devbrew
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devbrew
  template:
    metadata:
      labels:
        app: devbrew
    spec:
      containers:
        - name: devbrew
          image: ghcr.io/yoon6yo/devbrew:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: devbrew-secrets
                  key: db-url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: devbrew-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devbrew-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devbrew-secrets
                  key: jwt-secret
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: devbrew-secrets
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devbrew-secrets
                  key: admin-password
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: devbrew-secrets
                  key: slack-webhook-url
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devbrew-secrets
                  key: gemini-api-key
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: devbrew-secrets
                  key: github-pat
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: devbrew
  namespace: devbrew
spec:
  selector:
    app: devbrew
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30081
  type: NodePort
