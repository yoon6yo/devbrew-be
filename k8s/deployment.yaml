apiVersion: v1
kind: Namespace
metadata:
  name: daybrew
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daybrew
  namespace: daybrew
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: daybrew
  template:
    metadata:
      labels:
        app: daybrew
    spec:
      containers:
        - name: daybrew
          image: ghcr.io/yoon6yo/devbrew-be:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: daybrew-secrets
                  key: db-url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: daybrew-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daybrew-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: daybrew-secrets
                  key: jwt-secret
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: daybrew-secrets
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daybrew-secrets
                  key: admin-password
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: daybrew-secrets
                  key: slack-webhook-url
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: daybrew-secrets
                  key: gemini-api-key
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: daybrew-secrets
                  key: github-pat
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: daybrew-secrets
                  key: admin-email
                  optional: true
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: daybrew-secrets
                  key: frontend-url
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: daybrew-secrets
                  key: google-client-id
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: daybrew-secrets
                  key: google-client-secret
                  optional: true
            - name: KAKAO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: daybrew-secrets
                  key: kakao-client-id
                  optional: true
            - name: KAKAO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: daybrew-secrets
                  key: kakao-client-secret
                  optional: true
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: daybrew
  namespace: daybrew
spec:
  selector:
    app: daybrew
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30081
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daybrew-fe
  namespace: daybrew
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: daybrew.duckdns.org
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: daybrew
                port:
                  number: 80
          - path: /oauth2/authorization/
            pathType: Prefix
            backend:
              service:
                name: daybrew
                port:
                  number: 80
          - path: /login/oauth2/
            pathType: Prefix
            backend:
              service:
                name: daybrew
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: daybrew-fe
                port:
                  number: 80
  tls:
    - hosts:
        - daybrew.duckdns.org
      secretName: daybrew-tls
