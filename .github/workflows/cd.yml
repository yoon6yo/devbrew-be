name: CD — Deploy (BE)

on:
  workflow_run:
    workflows: ["CI/CD — BE"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to k3s via SSH
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_USER: ${{ github.actor }}

    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.K8S_SSH_HOST }}
          port: ${{ secrets.K8S_SSH_PORT || 22 }}
          username: ${{ secrets.K8S_SSH_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          envs: DEPLOY_SHA,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            kubectl create secret docker-registry ghcr-secret \
              -n daybrew \
              --docker-server=ghcr.io \
              --docker-username="${GHCR_USER}" \
              --docker-password="${GHCR_TOKEN}" \
              --dry-run=client -o yaml | kubectl apply -f -
            curl -fs https://raw.githubusercontent.com/yoon6yo/devbrew-be/${DEPLOY_SHA}/k8s/deployment.yaml \
              | sed "s|image: ghcr.io/yoon6yo/devbrew-be:.*|image: ghcr.io/yoon6yo/devbrew-be:sha-${DEPLOY_SHA}|" \
              | kubectl apply -f -
            kubectl rollout status deployment/daybrew -n daybrew --timeout=300s || {
              echo "=== ROLLOUT FAILED — DIAGNOSTICS ==="
              kubectl get pods -n daybrew -o wide
              echo "--- Pod events ---"
              kubectl describe pod -n daybrew -l app=daybrew | tail -40
              POD=$(kubectl get pod -n daybrew -l app=daybrew -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              echo "--- Previous container logs (pod: $POD) ---"
              kubectl logs -n daybrew "$POD" --previous 2>/dev/null | tail -200 || echo "(no previous logs)"
              echo "--- Current container logs (pod: $POD) ---"
              kubectl logs -n daybrew "$POD" 2>/dev/null | tail -200 || echo "(no current logs)"
              exit 1
            }
