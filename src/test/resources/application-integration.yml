spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

logging:
  level:
    com.daybrew: WARN
    org.flywaydb: WARN

daybrew:
  jwt:
    secret: integration-test-jwt-secret-must-be-32-chars
  admin:
    username: testadmin
    password: ""
    email: testadmin@daybrew.test
  frontend:
    url: http://localhost:5173
  slack:
    webhook-url: ""
  gemini:
    api-key: test-api-key
    base-url: https://generativelanguage.googleapis.com
  pipeline:
    reddit:
      subreddits: SaaS
      user-agent: daybrew-test/1.0
    github:
      pat: ""
      min-stars: 100
      max-stars: 2000
    viral:
      seed-topics:
        - browser-extension
