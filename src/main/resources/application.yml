spring:
  application:
    name: devbrew-be
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devbrew}
    username: ${DB_USERNAME:devbrew}
    password: ${DB_PASSWORD:devbrew}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.devbrew: DEBUG
    org.flywaydb: INFO

devbrew:
  jwt:
    secret: ${JWT_SECRET:devbrew-secret-key-change-in-production-32ch}
    expiration-ms: 86400000
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
  pipeline:
    reddit:
      subreddits: SaaS,entrepreneur,startups,webdev,programming
      user-agent: devbrew/1.0 (idea-curator)
    github:
      pat: ${GITHUB_PAT:}
      min-stars: 100
      max-stars: 2000
    viral:
      seed-topics:
        - browser-extension
        - cli-tool
        - discord-bot
        - notion-integration
        - chrome-extension
