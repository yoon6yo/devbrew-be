spring:
  application:
    name: daybrew-be
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: account_email, profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/daybrew}
    username: ${DB_USERNAME:daybrew}
    password: ${DB_PASSWORD:daybrew}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    com.daybrew: INFO
    org.flywaydb: INFO

daybrew:
  jwt:
    secret: ${JWT_SECRET:daybrew-secret-key-change-in-production-32ch}
    expiration-ms: 86400000
    issuer: ${JWT_ISSUER:daybrew}
    audience: ${JWT_AUDIENCE:daybrew-users}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    email: ${ADMIN_EMAIL:admin@daybrew.local}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  pipeline:
    reddit:
      subreddits: SaaS,entrepreneur,startups,webdev,programming
      user-agent: daybrew/1.0 (idea-curator)
      client-id: ${REDDIT_CLIENT_ID:}
      client-secret: ${REDDIT_CLIENT_SECRET:}
    github:
      pat: ${GITHUB_PAT:}
      min-stars: 100
      max-stars: 2000
    viral:
      seed-topics:
        - browser-extension
        - cli-tool
        - discord-bot
        - notion-integration
        - chrome-extension
